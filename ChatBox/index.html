<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ChatBox</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <main>
        <h1 style="padding:20px">Halaman dengan ChatBox</h1>
        <p style="padding:0 20px 1200px">Scroll halaman untuk memastikan chatbox tetap di pojok kanan bawah.</p>
    </main>

    <div class="chatbox" id="chatbox" aria-hidden="false">
        <div class="chat-header" id="chatHeader">
            <strong>Chat</strong>
            <button id="chatToggle" aria-label="Tutup chat">—</button>
        </div>
        <div class="chat-body" id="chatBody" role="log" aria-live="polite">
            <div class="messages" id="messages"></div>
        </div>
        <form class="chat-input" id="chatForm" aria-label="Kirim pesan">
            <textarea id="msgInput" placeholder="Tulis pesan..." rows="1" aria-label="Tulis pesan"></textarea>
            <button type="submit" aria-label="Kirim pesan">Kirim</button>
        </form>
    </div>

    <script src="assets/js/chat.js"></script>
</body>

</html>
