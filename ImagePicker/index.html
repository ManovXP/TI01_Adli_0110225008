<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Image Picker</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <main class="container">
        <h1>Image Picker</h1>
        <p>Pilih gambar dari dropdown, gambar akan tampil di bawah dan akan muncul kotak alert berisi nama file.</p>

        <label for="imageSelect">Pilih gambar:</label>
        <select id="imageSelect">
            <option value="">-- Pilih gambar --</option>
        </select>

        <div class="preview">
            <img id="previewImg" alt="Preview gambar" src="" />
        </div>
    </main>

    <script src="assets/js/imagepicker.js"></script>
</body>

</html>
