<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Web Profile - Adli Abdurrahman Syah</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .frame-wrapper {
      display: flex;
      height: calc(100vh - 72px)
    }

    .left-frame {
      width: 260px;
      border-right: 1px solid #e6e6e6
    }

    .right-frame {
      flex: 1
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0
    }

    header.site-header {
      position: static
    }
  </style>
</head>

<body>
  <header class="site-header">
    <h1>Profil Web</h1>
  </header>

  <div class="frame-wrapper">
    <div class="left-frame">
      <iframe src="menu.html" name="menu" title="Menu"></iframe>
    </div>
    <div class="right-frame">
      <iframe src="profile.html" name="content" title="Content"></iframe>
    </div>
  </div>
</body>

</html>
